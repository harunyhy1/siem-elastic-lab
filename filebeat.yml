filebeat.inputs:
  - type: filestream
    id: siem-ssh-auth
    enabled: true
    paths:
      - /var/log/siem/auth.log
    parsers:
      - ndjson:
          target: ""
          overwrite_keys: true

setup.ilm.enabled: false
setup.template.name: "filebeat-siem-lab"
setup.template.pattern: "filebeat-siem-lab*"

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  username: "elastic"
  password: "${ELASTIC_PASSWORD}"
  index: "filebeat-siem-lab"

logging.level: info
